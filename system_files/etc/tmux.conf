# Default options (converted from NixOS module options)
set -g default-terminal "tmux-256color"
set-window-option -g mode-keys vi
set -g base-index 1

# Mouse support
set -g mouse on

# Escape key responsiveness
set -sg escape-time 0

# Terminal Overrides (True color support)
set -ga terminal-overrides ",*:RGB"

# Clipboard Integration
set -g set-clipboard on

# Vim-like pane selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane splitting (opens in current working directory)
unbind %
bind | split-window -h -c "#{pane_current_path}"
unbind '"'
bind _ split-window -v -c "#{pane_current_path}"

# Reload configuration
unbind r
bind r source-file /etc/tmux.conf

# Pane indexing & window renumbering
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Vim-like copy/paste mode keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
unbind -T copy-mode-vi MouseDragEnd1Pane

# Alt + hjkl to switch panes without prefix
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Alt + number to select window directly
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Status bar styling
set -g status-bg "black"
set -g window-status-separator ""
set-option -g status "on"
set-option -g status-interval 60
set-option -g status-left "#[fg=colour237, bg=colour248] #S "
set-option -g status-right "#[fg=colour237, bg=colour248] %H:%M #(cat /sys/class/power_supply/BAT0/capacity)% "
set-window-option -g window-status-current-format "#[fg=colour237, bg=colour248] #[bold]#I | #W#[nobold] "
set-window-option -g window-status-format "#[fg=colour237, bg=colour248] #I | #W "
